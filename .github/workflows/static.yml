# Build and deploy static site
name: Build and deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # Changes to these files don't affect the site, so don't deploy for them
    paths-ignore:
      - "CLAUDE.md"
      - "README.md"
      - "LICENSE"
      - ".editorconfig"
      - ".mcp.json"
      - ".vscode/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default; the deploy job is granted the extra Pages permissions it needs
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: produces the Pages artifact exactly once
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The app build doesn't include the site's data (src/data), which is
      # generated separately into assets/data.json. So when only data has
      # changed, reuse the previous app build instead of rebuilding it.
      # Assets aren't cached: they're copied from src/assets instead.
      - name: Restore app build
        id: app-build
        uses: actions/cache@v6
        with:
          path: |
            dist/shinypokemon.fun/browser
            !dist/shinypokemon.fun/browser/assets
          key: app-build-${{ hashFiles('src/**', '!src/data/**', '!src/assets/**', 'angular.json', 'package.json', 'package-lock.json', 'tsconfig*.json', 'scripts/build-app.ts') }}
      - name: Build app
        if: steps.app-build.outputs.cache-hit != 'true'
        run: npm run build-app
      - name: Copy assets into reused app build
        if: steps.app-build.outputs.cache-hit == 'true'
        run: cp -r src/assets dist/shinypokemon.fun/browser/
      - name: Build data
        run: npm run build-data
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the built site
          path: 'dist/shinypokemon.fun/browser'

  # Deploy job: only deploys the already-built artifact, so it can be
  # re-run safely without producing a second "github-pages" artifact.
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
